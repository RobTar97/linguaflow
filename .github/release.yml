changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: New conversation content
      labels:
        - content
        - translation
    - title: Product improvements
      labels:
        - enhancement
        - accessibility
    - title: Fixes
      labels:
        - bug
    - title: Documentation and maintenance
      labels:
        - documentation
        - dependencies
    - title: Other changes
      labels:
        - "*"
